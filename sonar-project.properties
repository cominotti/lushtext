# SonarQube Cloud project configuration for LushText.
#
# Rust is not eligible for SonarQube Cloud automatic analysis, so this file is
# consumed by the CI-based scanner job in .github/workflows/sonarqube.yml.

sonar.organization=cominotti
sonar.projectKey=cominotti_lushtext
sonar.sourceEncoding=UTF-8

# Keep analysis on maintained code, CI, packaging, and active build/configuration
# surfaces. Agent guidance, docs, OpenSpec history, and local proof output are
# intentionally outside this CI quality gate.
sonar.sources=crates,fuzz,scripts,.github,build-aux,data,resources,po,snap,Cargo.toml,Cargo.lock,Makefile,meson.build,meson_options.txt,deny.toml,rust-toolchain.toml,sonar-project.properties

sonar.exclusions=\
  **/target/**,\
  .flatpak-builder/**,\
  builddir/**,\
  _build/**,\
  build/blueprint-validation/**,\
  build/blueprint-visual-diff/**,\
  build/gnome-50-ui-spikes/**,\
  build/gtk-proof/**,\
  build/gtk-lush-adoption/**,\
  build/proof-corpus/**,\
  build/smoke/**,\
  .sonar/**,\
  .claude/worktrees/**,\
  fixtures/gtk-lush-adoption/*/target/**,\
  openspec/changes/archive/**,\
  build-aux/cargo-sources.json,\
  data/gschemas.compiled

# First-scan triage suppressions. Each entry is limited by rule and resource
# family; product bugs remain visible outside these intentional patterns.
#
# - githubactions:S7637/S8544: workflows intentionally use maintained action
#   tags or upstream installer URLs where SHA pinning would create repo-wide
#   update churn; existing CI and release gates verify the resolved behavior.
# - githubactions:S6506: affected curl invocations already target HTTPS-only
#   upstreams; changing every release/mutation installer is a separate workflow
#   hardening track.
# - githubactions:S8264: mutation-testing keeps read permissions at workflow
#   scope because every job has the same least-privilege read-only need.
# - rust:S3776: high-complexity Rust functions are GTK/service orchestration
#   points where splitting would hide stateful workflow sequencing.
# - css:S1874/S4659/S4670: GTK CSS uses toolkit selectors and pseudo-classes
#   that generic web CSS analyzers do not understand.
# - shell/Python duplicate-literal, regex, complexity, and argument-shape rules:
#   repository scripts are policy/smoke drivers where repeated scenario tokens,
#   explicit regexes, and command-shaped boundaries are clearer than helper
#   indirection.
# - pythonsecurity:*: flagged scripts operate on trusted repo-local fixtures,
#   CI artifacts, or same-user smoke inputs; command/path construction is the
#   intended harness boundary and is still covered by existing policy tests.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30
