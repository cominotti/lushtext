name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g. v0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate and build without publishing release or Flathub PR'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry-run: ${{ steps.version.outputs.dry-run }}
      checkout-ref: ${{ steps.version.outputs.checkout-ref }}
    steps:
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
            checkout_ref="main"
          else
            version="$REF_NAME"
            dry_run="false"
            checkout_ref="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+(\.[A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "dry-run=$dry_run"
            echo "checkout-ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils flatpak flatpak-builder jq python3-pip
          python3 -m pip install --user --break-system-packages aiohttp PyYAML tomlkit || \
            python3 -m pip install --user aiohttp PyYAML tomlkit
          curl -fsSL \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py \
            -o "$RUNNER_TEMP/flatpak-cargo-generator.py"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/flatpak-cargo-generator.py" "$HOME/.local/bin/flatpak-cargo-generator"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            make release VERSION="$VERSION" DRY_RUN=1
          else
            ./scripts/release.sh validate-tag "$VERSION" 1
          fi

      - name: Generate Flathub update artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "$VERSION^{commit}")"
          ./scripts/generate-flathub-manifest.sh "$VERSION" "$source_commit" "$RUNNER_TEMP/flathub"
          ./scripts/verify-flathub-manifest.sh "$RUNNER_TEMP/flathub/dev.cominotti.lushtext.json"

      - name: Upload Flathub update artifact
        uses: actions/upload-artifact@v4
        with:
          name: flathub-update
          path: |
            ${{ runner.temp }}/flathub/dev.cominotti.lushtext.json
            ${{ runner.temp }}/flathub/cargo-sources.json

  flatpak:
    name: Release Flatpak Build
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.checkout-ref }}
          fetch-depth: 0

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/dev.cominotti.lushtext.Flatpak.json
          bundle: lushtext-${{ needs.metadata.outputs.version }}.flatpak
          cache-key: release-flatpak-builder-gnome-50-${{ hashFiles('build-aux/dev.cominotti.lushtext.Flatpak.json', 'build-aux/cargo-sources.json', 'Cargo.lock', 'meson.build', 'meson_options.txt', 'build-aux/cargo.sh', 'data/meson.build', 'resources/meson.build') }}

  cominotti-flatpak:
    name: Cominotti Flatpak Repository
    needs: metadata
    if: needs.metadata.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: read
    outputs:
      generated: ${{ steps.generate.outputs.generated }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.checkout-ref }}
          fetch-depth: 0

      - name: Prepare Cominotti signing material
        id: signing
        env:
          COMINOTTI_PRIVATE_KEY_B64: ${{ secrets.COMINOTTI_FLATPAK_PRIVATE_KEY_B64 }}
          COMINOTTI_PUBLIC_KEY_B64: ${{ secrets.COMINOTTI_FLATPAK_PUBLIC_KEY_B64 }}
          COMINOTTI_GPG_KEY: ${{ secrets.COMINOTTI_FLATPAK_GPG_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${COMINOTTI_PRIVATE_KEY_B64:-}" || -z "${COMINOTTI_PUBLIC_KEY_B64:-}" || -z "${COMINOTTI_GPG_KEY:-}" ]]; then
            echo "::notice::Skipping Cominotti Flatpak repository generation because signing secrets are not configured."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gpg_home="$RUNNER_TEMP/cominotti-gnupg"
          mkdir -p "$gpg_home"
          chmod 700 "$gpg_home"
          printf '%s' "$COMINOTTI_PRIVATE_KEY_B64" | base64 -d | GNUPGHOME="$gpg_home" gpg --batch --import
          printf '%s' "$COMINOTTI_PUBLIC_KEY_B64" | base64 -d > "$RUNNER_TEMP/cominotti-flatpak-public.gpg"
          {
            echo "available=true"
            echo "gpg-home=$gpg_home"
            echo "public-key=$RUNNER_TEMP/cominotti-flatpak-public.gpg"
          } >> "$GITHUB_OUTPUT"

      - name: Generate and verify Cominotti Flatpak repository
        id: generate
        if: steps.signing.outputs.available == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          COMINOTTI_FLATPAK_PUBLIC_KEY: ${{ steps.signing.outputs.public-key }}
          COMINOTTI_FLATPAK_GPG_KEY: ${{ secrets.COMINOTTI_FLATPAK_GPG_KEY }}
          COMINOTTI_FLATPAK_GPG_HOMEDIR: ${{ steps.signing.outputs.gpg-home }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source_commit="$(git rev-parse "$VERSION^{commit}")"
          ./scripts/generate-cominotti-flatpak-repo.sh "$VERSION" "$source_commit" "$RUNNER_TEMP/cominotti-flatpak"
          ./scripts/verify-cominotti-flatpak-repo.sh "$RUNNER_TEMP/cominotti-flatpak"
          ./scripts/verify-cominotti-pages-limits.sh "$RUNNER_TEMP/cominotti-flatpak/flatpak"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload Cominotti Flatpak repository artifact
        if: steps.generate.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cominotti-flatpak-repository
          path: ${{ runner.temp }}/cominotti-flatpak/flatpak

  cominotti-flatpak-deploy:
    name: Deploy Cominotti Flatpak Repository
    needs: [metadata, cominotti-flatpak]
    if: needs.metadata.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.version }}
          fetch-depth: 0

      - name: Select Cominotti Flatpak deployment backend
        id: deploy
        env:
          GENERATED: ${{ needs.cominotti-flatpak.outputs.generated }}
          COMINOTTI_FLATPAK_DEPLOY_COMMAND: ${{ vars.COMINOTTI_FLATPAK_DEPLOY_COMMAND }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.COMINOTTI_FLATPAK_CLOUDFLARE_PAGES_PROJECT || 'cominotti-sw-flatpak' }}
        run: |
          set -euo pipefail
          if [[ "$GENERATED" != "true" ]]; then
            echo "::notice::Skipping Cominotti Flatpak deployment because repository generation was skipped."
            echo "backend=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${COMINOTTI_FLATPAK_DEPLOY_COMMAND:-}" ]]; then
            echo "backend=custom" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_PAGES_PROJECT:-}" ]]; then
            echo "::notice::Skipping Cominotti Flatpak deployment because Cloudflare Pages credentials or project settings are not configured."
            echo "backend=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "backend=cloudflare"
            echo "cloudflare-project=$CLOUDFLARE_PAGES_PROJECT"
          } >> "$GITHUB_OUTPUT"

      - name: Download Cominotti Flatpak repository artifact
        if: steps.deploy.outputs.backend != 'none'
        uses: actions/download-artifact@v4
        with:
          name: cominotti-flatpak-repository
          path: cominotti-flatpak/flatpak

      - name: Verify Cloudflare Pages limits
        if: steps.deploy.outputs.backend == 'cloudflare'
        run: ./scripts/verify-cominotti-pages-limits.sh cominotti-flatpak/flatpak

      - name: Deploy Cominotti Flatpak repository
        if: steps.deploy.outputs.backend == 'custom'
        env:
          COMINOTTI_FLATPAK_DEPLOY_COMMAND: ${{ vars.COMINOTTI_FLATPAK_DEPLOY_COMMAND }}
          COMINOTTI_FLATPAK_STAGING_DIR: ${{ github.workspace }}/cominotti-flatpak/flatpak
        run: |
          set -euo pipefail
          bash -lc "$COMINOTTI_FLATPAK_DEPLOY_COMMAND"

      - name: Deploy Cominotti Flatpak repository to Cloudflare Pages
        if: steps.deploy.outputs.backend == 'cloudflare'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cominotti-flatpak/flatpak --project-name=${{ steps.deploy.outputs.cloudflare-project }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  publish-context:
    name: GitHub Release And Optional Flathub PR
    needs: [metadata, flatpak, cominotti-flatpak, cominotti-flatpak-deploy]
    if: needs.metadata.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.version }}
          fetch-depth: 0

      - name: Download Flathub update artifact
        uses: actions/download-artifact@v4
        with:
          name: flathub-update
          path: flathub-update

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "LushText $VERSION"
          else
            gh release create "$VERSION" --verify-tag --title "LushText $VERSION" --generate-notes
          fi

      - name: Create Flathub manifest PR
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          FLATHUB_REPOSITORY: ${{ vars.FLATHUB_REPOSITORY }}
          FLATHUB_BASE_BRANCH: ${{ vars.FLATHUB_BASE_BRANCH || 'master' }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" || -z "${FLATHUB_REPOSITORY:-}" ]]; then
            echo "::notice::Skipping optional Flathub PR because FLATHUB_TOKEN or FLATHUB_REPOSITORY is not configured. Cominotti Flatpak publication is the primary channel."
            exit 0
          fi

          branch="release/${VERSION}"
          source_commit="$(git rev-parse "$VERSION^{commit}")"
          gh repo clone "$FLATHUB_REPOSITORY" flathub-repo
          cd flathub-repo
          git checkout -B "$branch"
          cp ../flathub-update/dev.cominotti.lushtext.json ./dev.cominotti.lushtext.json
          cp ../flathub-update/cargo-sources.json ./cargo-sources.json
          git add dev.cominotti.lushtext.json cargo-sources.json
          if git diff --cached --quiet; then
            echo "No Flathub manifest changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update LushText to ${VERSION}"
          git push --force-with-lease origin "$branch"

          body="$(mktemp)"
          cat > "$body" <<EOF
          Updates LushText to ${VERSION}.

          Source commit: ${source_commit}

          Validation:
          - Release metadata validation passed.
          - Release Flatpak build passed.
          - Generated manifest was checked for Flathub invariants.

          Manual checks before merge:
          - Install the Flathub build artifact from the PR.
          - Launch LushText and open a local workspace.
          - Confirm document editing, save, workspace search, and Markdown preview still work.

          The Cominotti Flatpak repository is the primary publication channel.
          Flathub automerge is intentionally not enabled by this workflow.
          EOF

          gh pr create \
            --repo "$FLATHUB_REPOSITORY" \
            --base "$FLATHUB_BASE_BRANCH" \
            --head "$branch" \
            --title "Update LushText to ${VERSION}" \
            --body-file "$body" || \
          {
            pr_url="$(gh pr list --repo "$FLATHUB_REPOSITORY" --head "$branch" --json url --jq '.[0].url')"
            if [[ -z "$pr_url" ]]; then
              echo "::error::Failed to create Flathub PR and no existing PR was found for $branch"
              exit 1
            fi
            gh pr edit \
              --repo "$FLATHUB_REPOSITORY" \
              "$pr_url" \
              --title "Update LushText to ${VERSION}" \
              --body-file "$body"
          }
