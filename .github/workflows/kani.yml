name: Kani

# Formal verification lane: every `#[kani::proof]` harness via `make kani`,
# one shard of scripts/kani-shards.py per matrix job, because the whole lane
# takes longer than the 30-minute job cap. The shard table and the Makefile's
# pinned KANI_VERSION are the only sources of truth: the `shards` job checks the
# table (membership and each shard's measured runner budget) and hands both to
# the matrix. Pull requests and pushes to main run only the shards the table
# gates `pull-request` (measured at most 15 minutes on this runner); the weekly
# schedule and manual dispatch run every shard. Every job runs in measurement
# mode, so its summary and its `kani-measure-<shard>` artifact carry the wall
# time, peak memory, and per-harness times the table's budgets come from.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 3"
  workflow_dispatch:

concurrency:
  group: kani-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shards:
    name: Kani Shard Table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.table.outputs.shards }}
      pr-shards: ${{ steps.table.outputs.pr-shards }}
      kani-version: ${{ steps.table.outputs.kani-version }}
      shard-flags: ${{ steps.table.outputs.shard-flags }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the shard table and export it
        id: table
        # `github-outputs` runs the same membership and budget checks as
        # `check` and exits non-zero before exporting anything if one fails.
        run: ./scripts/kani-shards.py github-outputs >> "$GITHUB_OUTPUT"

  kani:
    name: Kani Proof Harnesses (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KANI_VERSION: ${{ needs.shards.outputs.kani-version }}
      # Extra `cargo kani` flags the table gives this shard alone (an
      # experimental feature such as loop contracts); `make kani` applies them
      # from the table, and the run step prints them so the job log says so.
      KANI_SHARD_FLAGS: ${{ join(fromJSON(needs.shards.outputs.shard-flags)[matrix.shard], ' ') }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes to main run the pull-request-gated shards;
        # schedule and dispatch run every shard.
        shard: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && needs.shards.outputs.pr-shards || needs.shards.outputs.shards) }}
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gcc-c++ \
            gettext \
            git \
            glib2-devel \
            python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-kani
          # Only the registry is worth caching here: nothing in this job builds
          # with the stable toolchain, and the Kani binaries have their own cache
          # below. Kani's target directory is deliberately not cached: measured
          # on this runner it saved under 1.5 minutes on widgets-geometry, less
          # than the 3 minutes that would justify ~650 MB of cache (see
          # docs/next/formal-verification.md, phase 2).
          cache-targets: false
          cache-bin: false

      - name: Restore the Kani install
        id: kani-install
        uses: actions/cache@v4
        with:
          # `cargo kani setup` unpacks its bundle into ~/.kani and installs the
          # nightly it pins through rustup, then links the bundle to it; all
          # three are needed for a restored install to run.
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ env.KANI_VERSION }}-fedora-44

      - name: Install Kani
        # The official Kani action assumes an Ubuntu runner; this lane runs in
        # the same Fedora container as every other job, so install directly.
        # A restored install is used only if it runs.
        run: |
          if [ "${{ steps.kani-install.outputs.cache-hit }}" = "true" ] && cargo kani --version; then
            echo "Using the cached Kani ${KANI_VERSION} install"
          else
            cargo install --locked --force kani-verifier --version "${KANI_VERSION}"
            cargo kani setup
          fi

      - name: Run Kani harnesses
        run: >-
          echo "Shard ${{ matrix.shard }} extra Kani flags: ${KANI_SHARD_FLAGS:-none}" &&
          make kani KANI_VERSION="${KANI_VERSION}" KANI_SHARD="${{ matrix.shard }}"
          KANI_MEASURE="kani-measure-${{ matrix.shard }}.json"

      - name: Upload the shard measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-measure-${{ matrix.shard }}
          path: kani-measure-${{ matrix.shard }}.json
          if-no-files-found: warn
