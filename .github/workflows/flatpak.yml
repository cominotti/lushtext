name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only || 'false' }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify pull request diff
        id: classify
        if: github.event_name == 'pull_request'
        run: |
          if ./scripts/precommit-scope.py docs-only-range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    name: Flatpak Build
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub (bilelmoussaoui/) stopped at gnome-47.
    # GNOME 48+ images are on ghcr.io/flathub-infra/.
    # Bump the tag when runtime-version changes in the Flatpak manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      # Moves the image's system installation off overlayfs before
      # flatpak-builder updates it (see the action's header).
      - uses: ./.github/actions/flatpak-build
        with:
          manifest-path: build-aux/dev.cominotti.lushtext.Flatpak.json
          bundle: lushtext.flatpak
          cache-key: flatpak-builder-gnome-51-${{ hashFiles('build-aux/dev.cominotti.lushtext.Flatpak.json', 'build-aux/cargo-sources.json', 'Cargo.lock', 'meson.build', 'meson_options.txt', 'build-aux/cargo.sh', 'data/meson.build', 'resources/meson.build', 'resources/dev.cominotti.lushtext.gresource.xml', 'resources/ui/*.ui', 'resources/ui/*.blp', 'resources/ui/template-contract.json', 'scripts/blueprint-templates.sh', 'scripts/check-ui-template-contract.py') }}
