name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    # Docker Hub (bilelmoussaoui/) stopped at gnome-47.
    # GNOME 48+ images are on ghcr.io/flathub-infra/.
    # Bump the tag when runtime-version changes in the Flatpak manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/dev.cominotti.lushtext.Flatpak.json
          bundle: lushtext.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
