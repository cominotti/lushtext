name: Flatpak

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    # Docker Hub (bilelmoussaoui/) stopped at gnome-47.
    # GNOME 48+ images are on ghcr.io/flathub-infra/.
    # Bump the tag when runtime-version changes in the Flatpak manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/dev.cominotti.lushtext.Flatpak.json
          bundle: lushtext.flatpak
          cache-key: flatpak-builder-gnome-50-${{ hashFiles('build-aux/dev.cominotti.lushtext.Flatpak.json', 'build-aux/cargo-sources.json', 'Cargo.lock', 'meson.build', 'meson_options.txt', 'build-aux/cargo.sh', 'data/meson.build', 'resources/meson.build', 'resources/dev.cominotti.lushtext.gresource.xml', 'resources/ui/*.ui', 'resources/ui/*.blp', 'resources/ui/template-contract.json', 'scripts/blueprint-templates.sh', 'scripts/check-ui-template-contract.py') }}
