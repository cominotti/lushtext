name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    # gtk4-rs 0.11 requires GTK >= 4.20 (GNOME 49). Ubuntu LTS only ships 4.14.
    # Fedora 43 ships GNOME 49 (GTK 4.20, Libadwaita 1.8, GtkSourceView 5).
    # Bump this when gtk4-rs minimum GTK version increases.
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            xorg-x11-server-Xvfb

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile-check benchmarks
        run: cargo bench -p lushtext-core --no-run

      - name: Run tests
        run: xvfb-run cargo test
