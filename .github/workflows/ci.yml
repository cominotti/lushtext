name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.19.8"
  CARGO_NEXTEST_VERSION: "0.9.137"
  CARGO_PUBLIC_API_VERSION: "0.52.0"
  CARGO_SEMVER_CHECKS_VERSION: "0.48.0"
  GTK_LUSH_MSRV: "1.96.0"
  GTK_LUSH_PUBLIC_API_TOOLCHAIN: "nightly-2026-06-01"

# Pull-request CI stays deterministic and bounded: no installed package,
# portal, AT-SPI, screenshot, or full benchmark timing requirements here.
# Those artifact-heavy checks live in end-user-smoke.yml and release-benchmark.yml.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # gtk4-rs 0.11 targets GNOME 50 here (GTK 4.22, Libadwaita 1.9).
    # Ubuntu LTS only ships GTK 4.14, so CI uses Fedora's current GNOME stack.
    # Bump this when gtk4-rs minimum GTK version increases.
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            blueprint-compiler \
            gcc \
            gettext \
            git \
            ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Filesystem boundary policy
        run: make check-filesystem-boundary

      - name: Agent guidance and skill policy
        run: make check-agent-skills

      - name: Workflow timeout policy
        run: make check-workflow-timeouts

      - name: Blueprint template drift and contract
        run: make check-blueprint

      - name: GTK Lush family policy
        run: make check-gtk-lush-policy

      - name: GTK Lush adoption evidence policy
        run: make gtk-lush-adoption-matrix

      - name: Rustdoc lint gate
        run: |
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::bare_urls" \
          cargo doc --workspace --no-deps

  non-widget-tests:
    name: Non-widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44

      - name: Install cargo-nextest
        run: curl -LsSf "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Run non-widget tests
        run: cargo nextest run --workspace

      - name: Run GTK Lush doctests
        run: make gtk-lush-doctests

      - name: Compile GTK Lush standalone examples
        run: make gtk-lush-examples

      - name: Test GTK Lush adoption lab
        run: make gtk-lush-adoption-lab

      - name: Check GTK Lush stock adoption fixtures
        run: make gtk-lush-stock-fixtures

  gtk-lush-msrv:
    name: GTK Lush MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            gcc \
            git

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-gtk-lush-msrv

      - name: Check GTK Lush family at MSRV
        run: make gtk-lush-msrv GTK_LUSH_MSRV="${GTK_LUSH_MSRV}"

  gtk-lush-api-advisory:
    name: GTK Lush API Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            gcc \
            git \
            openssl-devel

      # Dated nightly toolchains are not published as dtolnay/rust-toolchain
      # action refs; the dated pin must flow through the toolchain input. The
      # action itself is pinned to an immutable commit SHA because its branch
      # refs are mutable.
      - name: Install pinned public API toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master as of 2026-03-27
        with:
          toolchain: ${{ env.GTK_LUSH_PUBLIC_API_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-gtk-lush-api

      - name: Install advisory API tools
        run: |
          cargo install --locked cargo-semver-checks --version "${CARGO_SEMVER_CHECKS_VERSION}"
          cargo install --locked cargo-public-api --version "${CARGO_PUBLIC_API_VERSION}"

      - name: Run advisory GTK Lush API checks
        run: make gtk-lush-api-advisory GTK_LUSH_PUBLIC_API_TOOLCHAIN="${GTK_LUSH_PUBLIC_API_TOOLCHAIN}"

      - name: Upload GTK Lush public API snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-lush-public-api
          path: target/gtk-lush-public-api

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-property

      - name: Install cargo-nextest
        run: curl -LsSf "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Run property tests
        run: make test-prop

  fuzz-corpus-replay:
    name: Fuzz Corpus Replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-fuzz-replay

      - name: Replay committed fuzz corpus seeds
        # The replay test is guarded by `lushtext-core/fuzzing`, so default
        # workspace nextest runs intentionally skip it. This explicit stable
        # lane keeps the committed corpus covered without installing nightly,
        # cargo-fuzz, sanitizer tooling, or a C++ compiler.
        run: make fuzz-corpus-replay

  widget-tests:
    name: Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            mutter \
            dbus-daemon

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44

      - name: Run widget tests
        # Widget tests use a custom single-threaded harness, so they must run
        # through `cargo test --test widget` under the shared runner instead of
        # nextest. The runner owns the mutter/dbus setup plus one retry for
        # transient compositor failures.
        run: ./scripts/run-widget-tests.sh --headless --retries 1

  bench-compile:
    name: Bench Compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 --no-docs --setopt=install_weak_deps=False --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=minrate=100k --setopt=timeout=30 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44

      - name: Compile-check benchmarks
        run: cargo bench -p lushtext-core --no-run

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "${CARGO_DENY_VERSION}"

      - name: Check dependency policy
        run: cargo deny check advisories bans sources licenses
