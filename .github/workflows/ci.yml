name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gtk4-rs 0.11 requires GTK >= 4.20 (GNOME 49). Ubuntu LTS only ships 4.14.
    # Fedora 43 ships GNOME 49 (GTK 4.20, Libadwaita 1.8, GtkSourceView 5).
    # Bump this when gtk4-rs minimum GTK version increases.
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-43

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc lint gate
        run: |
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::bare_urls" \
          cargo doc --workspace --no-deps

  non-widget-tests:
    name: Non-widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-43

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin

      - name: Run non-widget tests
        run: cargo nextest run --workspace

  widget-tests:
    name: Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            mutter \
            dbus-daemon

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-43

      - name: Run widget tests
        # Widget tests use a custom single-threaded harness, so they must run
        # through `cargo test --test widget` under the shared runner instead of
        # nextest. The runner owns the mutter/dbus setup plus one retry for
        # transient compositor failures.
        run: ./scripts/run-widget-tests.sh --headless --retries 1

  bench-compile:
    name: Bench Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-43

      - name: Compile-check benchmarks
        run: cargo bench -p lushtext-core --no-run

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check dependency policy
        run: cargo deny check advisories bans sources
