name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gtk4-rs 0.11 requires GTK >= 4.20 (GNOME 49). Ubuntu LTS only ships 4.14.
    # Fedora 43 ships GNOME 49 (GTK 4.20, Libadwaita 1.8, GtkSourceView 5).
    # Bump this when gtk4-rs minimum GTK version increases.
    container:
      image: registry.fedoraproject.org/fedora:43

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            curl \
            mutter \
            dbus-daemon

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile-check benchmarks
        run: cargo bench -p lushtext-core --no-run

      - name: Run tests
        # Widget tests need a display server. Mutter headless replaces Xvfb:
        # Xvfb exhausts X11 server resources after ~160 process connect/disconnect
        # cycles (nextest spawns one process per test). Wayland's client-side
        # rendering has no such limit. This is the same pattern GNOME GTK CI uses.
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export GDK_BACKEND=wayland
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          dbus-run-session -- \
            mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 -- \
              cargo nextest run
