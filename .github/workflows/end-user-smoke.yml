name: End-User Smoke

on:
  schedule:
    - cron: "37 7 * * 3"
  workflow_dispatch:

concurrency:
  group: end-user-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-lanes:
    name: Smoke (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Host-sensitive smoke lanes are scheduled/manual instead of PR-required.
    # They preserve artifacts so failures can be understood without immediate
    # local portal, compositor, or AT-SPI reproduction.
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: automation
            container_image: registry.fedoraproject.org/fedora:44
            command: make automation-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/automation
          - lane: builder-diagnostics
            container_image: ghcr.io/cominotti/lushtext-builder-diagnostics-runtime:gnome-50-debug
            command: make builder-diagnostics-smoke SMOKE_ARTIFACT_DIR=build/smoke LUSHTEXT_BUILDER_DIAGNOSTICS_PROVIDER=host LUSHTEXT_BUILDER_DIAGNOSTICS_REQUIRED=1
            artifact_path: build/smoke/builder-diagnostics
          - lane: visual-geometry
            container_image: registry.fedoraproject.org/fedora:44
            command: make visual-geometry-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/visual-geometry
          - lane: visual
            container_image: registry.fedoraproject.org/fedora:44
            command: make visual-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/visual
          - lane: editor-glyph-live
            container_image: registry.fedoraproject.org/fedora:44
            command: make editor-glyph-live-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/editor-glyph-live
          - lane: crash-recovery
            container_image: registry.fedoraproject.org/fedora:44
            command: make crash-recovery-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/crash-recovery
          - lane: portal-sandbox
            container_image: registry.fedoraproject.org/fedora:44
            command: make portal-sandbox-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/portal-sandbox
          - lane: accessibility
            container_image: registry.fedoraproject.org/fedora:44
            command: make accessibility-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/accessibility
          - lane: performance
            container_image: registry.fedoraproject.org/fedora:44
            command: make performance-smoke SMOKE_ARTIFACT_DIR=build/smoke
            artifact_path: build/smoke/performance

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            curl \
            jq \
            file \
            flatpak \
            dbus-daemon \
            glib2 \
            mutter \
            gstreamer1 \
            pipewire \
            pipewire-utils \
            wireplumber \
            python3 \
            python3-gobject \
            python3-pyatspi \
            at-spi2-core

      - name: Install editor glyph smoke dependencies
        if: ${{ matrix.lane == 'editor-glyph-live' }}
        run: |
          # The live glyph lane types through Xvfb/X11 and inspects PNG crops.
          dnf --disablerepo=fedora-cisco-openh264 install -y \
            ImageMagick \
            xdotool \
            xorg-x11-server-Xvfb \
            xorg-x11-apps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-end-user-smoke-${{ matrix.lane }}

      - name: Run ${{ matrix.lane }} smoke
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.lane }} smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.lane }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 7

  benchmark-report:
    name: Benchmark Report (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deeper Criterion reports stay scheduled/manual and are split by scope so
    # no individual diagnostic job can run beyond the repository time budget.
    container:
      image: registry.fedoraproject.org/fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: release-safe
            mode: short
            report_scope: release
            filters: "file_index_incremental content_search_smoke json_persistence replace_preview_generation recovery_performance"
          - scope: diagnostic-palette-index
            mode: full
            report_scope: diagnostic
            filters: "fuzzy_score file_index_search file_index_incremental search_all"
          - scope: diagnostic-file-tree
            mode: full
            report_scope: diagnostic
            filters: "file_index_rebuild scan_directory tree_population"
          - scope: diagnostic-editor-io
            mode: full
            report_scope: diagnostic
            filters: "utf8_validation editor_file_io file_size_classify"
          - scope: diagnostic-replace-recovery
            mode: full
            report_scope: diagnostic
            filters: "json_persistence draft_restore replace_preview_generation replace_undo_workflows recovery_performance"
          - scope: diagnostic-content-search
            mode: full
            report_scope: diagnostic
            filters: "content_search content_search_smoke"

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          dnf --disablerepo=fedora-cisco-openh264 install -y \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gcc \
            gettext \
            git \
            jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fedora-44-end-user-bench-report-${{ matrix.scope }}

      - name: Run benchmark report
        env:
          BENCH_REPORT_MODE: ${{ matrix.mode }}
          BENCH_REPORT_SCOPE: ${{ matrix.report_scope }}
          BENCH_REPORT_FILTERS: ${{ matrix.filters }}
          BENCH_REPORT_OUT_DIR: build/benchmark-report/${{ matrix.scope }}
        run: |
          set -euo pipefail
          args=(--mode "$BENCH_REPORT_MODE" --scope "$BENCH_REPORT_SCOPE" --out-dir "$BENCH_REPORT_OUT_DIR")
          for filter in $BENCH_REPORT_FILTERS; do
            args+=(--filter "$filter")
          done
          ./scripts/bench-report.sh "${args[@]}"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.scope }}
          path: build/benchmark-report/${{ matrix.scope }}/*.md
          if-no-files-found: warn
          retention-days: 14
