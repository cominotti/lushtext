# cargo-nextest configuration.
# See: https://nexte.st/docs/configuration/

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# Widget tests require a display server (mutter headless in CI, native display
# locally). One retry guards against transient compositor failures.
[[profile.default.overrides]]
filter = 'binary_id(lushtext::widget)'
retries = 1
