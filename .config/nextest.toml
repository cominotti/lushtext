# cargo-nextest configuration.
# See: https://nexte.st/docs/configuration/

[profile.default]
default-filter = "not binary(=widget)"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.property]
# Property tests are pure but generated. Give a little more room for shrinking
# while keeping stuck cases bounded.
slow-timeout = { period = "60s", terminate-after = 2 }

# Widget execution is owned by scripts/run-widget-tests.sh or by the widget
# binary's self-supervised headless path under plain Cargo. Keep it outside
# nextest's default run so `make test` does not duplicate widget coverage or
# shard it into many compositor sessions.
