[[crates]]
package = "gtk-lush-axioms"
lab_workflow = "Probe runner: crates/gtk-lush-adoption-lab/tests/axiom_probes.rs registers one gtk-lush-proof-harness test per catalogue entry with a probe, runs each in its own child process under private mutter --headless, prints the observation JSON line, and fails unless the verdict is Holds. The second consumer adds one dependency and calls the probes."
standalone_example = "crates/gtk-lush/axioms/examples/a01_realized_rows_are_capped.rs and one aNN_<slug>.rs sample per probed axiom (A1, A2, A3, A4, A5, A6, A7, A9, A10, A11, A13, A14, A15, A16, A17, A18, A19, A20), interactive by default and a headless verdict with --check."
stock_fixture_status = "Not selected for timed stock fixture; probes need a compositor, so their evidence is the headless probe runner and sample checks."
tests_proof_evidence = "make gtk-axioms (probe runner plus every sample --check under private mutter --headless, and the CI gtk-axioms job); cargo test -p gtk-lush-axioms --lib (catalogue ids and JSON encoding); make check-gtk-axioms keeps the ledger, catalogue, probes, and samples in agreement; make gtk-lush-examples; make gtk-lush-doctests."
friction_status = "Accepted limitation: family crates may not depend on gtk-lush-proof-harness, so the probe runner lives in the adoption lab and the crate carries its own small bounded main-context wait."
api_decision = "Keep the catalogue, Observation, Verdict, and per-axiom probe functions; fixtures stay public only because the samples share them."
follow_up = "None for this phase. A14-A20 are pinned here and A10 was rewritten with its own probe; the A7/A8 review in extend-closed-loop-geometry-verification is done: both are reachable, the slice-loop model carries an explicit A7 anchor, and A8 bounds only the child's own estimate correction."
