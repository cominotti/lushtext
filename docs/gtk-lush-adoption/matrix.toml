tests_proof_evidence = "cargo test -p gtk-lush-adoption-lab --bins; make gtk-lush-examples; cargo test -p lushtext --test widget gtk_lush_adoption; make test-widget-headless; widget lane workspace_tree_virtualization proves rendered rows past the GtkListView cap; widget lane gtk_lush_adoption proves, with a synthetic GtkScrollable, that a scroll_to made while the child reconfigures its geometry is deferred and honoured rather than erased; property lane viewport_slice proves the slice geometry and the classify_child_scroll decision; make kani proves both decisions panic-free for every f64 and proves containment, visible-intersection coverage, and exact request landing on whole pixels, with should_panic harnesses keeping the general-f64 counterexamples."
friction_status = "Accepted limitation: capture needs mapped drawable geometry; NotReady variants make this explicit. ViewportSliceBin needs an outer GtkScrolledWindow ancestor (or the outer-scrolled-window property) to virtualize; standalone it behaves as a plain host."
