[package]
name = "lushtext-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root. The repository workspace excludes `fuzz`, but Cargo
# keeps walking up from an excluded package, so a checkout nested inside
# another checkout (an agent worktree under `.claude/worktrees/`) resolved the
# outer repository's workspace and `make fuzz-smoke` failed with "current
# package believes it's in a workspace when it's not".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lushtext-core = { path = "../crates/lushtext-core", features = ["fuzzing"] }

[[bin]]
name = "editor_bytes"
path = "fuzz_targets/editor_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_preprocess"
path = "fuzz_targets/markdown_preprocess.rs"
test = false
doc = false
bench = false

[[bin]]
name = "operation_script"
path = "fuzz_targets/operation_script.rs"
test = false
doc = false
bench = false
