# cargo-mutants configuration for LushText.
#
# The default scope intentionally targets deterministic model, service, and
# pure-helper logic, plus workflow policy modules included by convention rather
# than by name (see the examine_globs note below). GTK widget harness coverage
# remains in scripts/run-widget-tests.sh, where Mutter, D-Bus, renderer
# settings, retries, and warning filtering are controlled.

test_tool = "nextest"
test_workspace = true

# CI uses --baseline=skip after a separate nextest baseline, so wrapper commands
# also pass an explicit --timeout. These values keep local baseline-driven runs
# from timing out too aggressively on slower GTK build hosts.
minimum_test_timeout = 60.0
timeout_multiplier = 5.0
build_timeout_multiplier = 3.0

gitignore = true

# `ui/**/policy.rs` is a naming convention, not a hand-listed file set: a
# workflow's pure decision logic lives in a `policy.rs` beside the workflow it
# serves, and that module must contain no `gtk4`, `glib`, `gio`, `libadwaita`,
# or `sourceview5` import. Including it by convention is what lets pure policy
# be co-located with its consumer without losing mutation coverage, so no new
# entry is needed here when a workflow migrates. `make check-workflow-boundaries`
# enforces three things: policy purity, that every `policy.rs` in the crate is
# reachable from this glob list, and -- because membership is decided by *name*
# -- that no GTK-free `ui/` module holds decision logic outside the convention
# under some other name. That third half is the inclusion-side blind spot: the
# first two can only inspect files this list already selects, so pure policy
# under any other file name was silently uncovered while every command exited 0.
# No hand-listed UI file entries remain: the last one retired when its module
# took a workflow role name.
#
# `ui/window/adaptive_shell.rs` became `ui/window/policy.rs` for exactly that
# reason. It was already pure and already correct, and it was reached by no entry
# at all, so it generated **0** mutants; after the rename the convention reaches
# it. That is a gain from zero and must not be reported as parity -- there was no
# before-count to claim parity against. Slot 7a recorded the gain as **80**;
# re-derived from the tool in slot 7b it is **81**, so the recorded figure was
# stale by one.
#
# Slot 7b then moved that module again, to
# `ui/window/geometry/policy.rs`, when `WFR-SHELL-GEOMETRY` took a per-workflow
# role home. **No entry here needed re-keying**, and that is the point of the
# convention rather than luck: the scope reaches it through `ui/**/policy.rs` by
# name, so a nested role home stays inside it. Verified after the move rather
# than assumed, per the nested-home rule, and reported as **relocation parity:
# 81 before, 81 after**, measured at the old path from a clean worktree at
# `69f78b09` and at the new path in this tree. No `exclude_re` entry references
# the module at either path, so nothing was silently disarmed.
#
# `ui/editor_page/minimap.rs` retired here when the minimap workflow migrated to
# `ui/editor_page/minimap/`. It was **not** re-pointed: the whole purpose of
# extracting `minimap/policy.rs` is that the convention now reaches the pure
# logic by name, and the GTK adapter beside it is legitimately out of scope for
# not being a policy module. A hand-listed entry left pointing at a moved path
# removes its file from the scope while the mutation command still exits 0, so
# the retirement was measured from the tool rather than read off the config.
#
# `ui/markdown_preview/inline_footnotes.rs` retired here on the same precedent
# when it became `ui/markdown_preview/policy.rs`. Unlike the minimap case this
# was a rename rather than an extraction, so the entry *did* select the file
# before. The relocation itself moved **175** mutants; the module then **gained
# 12** when the facade migration moved this workflow's fuzz and property-test
# entry points into it, so it now generates **187**. Those are reported
# separately: 175 relocated, 12 gained. An earlier revision of this comment
# claimed "175 before, 175 after" parity, which was measured before the gain and
# was therefore false.
#
# The six calibrated `exclude_re` entries below were re-keyed to the new path and
# verified by **direct measurement**, not by an unchanged total: the module
# generates 210 mutants with those entries removed and 187 with them applied, so
# all six match real generated mutants and together suppress 23.
examine_globs = [
    "crates/lushtext-model/src/**/*.rs",
    "crates/lushtext-services/src/**/*.rs",
    "crates/lushtext-ui/src/ui/**/policy.rs",
]

exclude_globs = [
    # Test modules are already skipped by cargo-mutants when marked cfg(test),
    # but standalone test files are excluded explicitly to keep the mutation
    # scope about production behavior.
    "crates/lushtext-services/src/palette/tests.rs",
    # Shared fixture helpers live under services so production tests use the
    # filesystem boundary, but they are not production behavior themselves.
    "crates/lushtext-services/src/filesystem/fixture.rs",
    # Its draft-body sibling is fixture code for the same reason (1 mutant).
    "crates/lushtext-services/src/persistence/draft_service/fixture.rs",
    # The conformance tap and drivers (`verify-shell-conformance-against-proven-cores`)
    # are test seams and test drivers, compiled only under `cfg(test)` and
    # `test-utils`: the active tap's state machine, the drivers, and the
    # shipping build's inert no-op entry points, which the mutation lane's
    # `test-utils` build never compiles.
    "crates/lushtext-services/src/filesystem/backend_tap.rs",
    "crates/lushtext-services/src/filesystem/backend_tap/**",
    "crates/lushtext-services/src/instrumentation/conformance/**",
    # The scalar scans the accelerated `editor_io::text_scans` replaced, kept
    # verbatim as the oracle the property tests and the `editor_bytes` fuzz
    # target compare against (`simd-line-scans`, design D1). An oracle is not
    # code under test: production cannot call it (it compiles only under
    # `cfg(test)`, `test-utils`, or `fuzzing`), and its correctness is the old
    # code's, which that change moved without editing. Path-keyed: re-key this
    # entry if the module moves.
    "crates/lushtext-services/src/editor_io/text_scans/reference.rs",
    # The per-file file index the arena replaced, kept as the oracle the
    # `index_parity` property tests compare against (`scale-file-index` D6),
    # and the module that turns owned rows into an arena (`owned.rs`, the
    # benches' and tests' constructor), both compiled only under `cfg(test)`
    # or `test-utils`. The D9 tree-shape fixture is test data. Path-keyed:
    # re-key these entries if the modules move.
    "crates/lushtext-services/src/palette/index/reference.rs",
    "crates/lushtext-services/src/palette/index/owned.rs",
    "crates/lushtext-services/src/palette/workspace_index_fixture.rs",
    "crates/lushtext-services/src/palette/index_scale_tests.rs",
    "crates/lushtext-services/src/palette/index/tests.rs",
    # Kani harness modules are verification code. Each is declared
    # `#[cfg(kani)] mod kani_proofs;`, so no build cargo-mutants runs compiles
    # it and no test can kill a mutant inside it: before this entry the scope
    # listed 171 such mutants (138 in draft_service/kani_proofs.rs, 33 in
    # filesystem/write_protocol/kani_proofs.rs), pure noise hiding real
    # survivors. The name is mandatory for harness modules (see
    # `.agents/rules/build.md`, Formal Verification), so this glob cannot drift
    # when a new harness is added. The directory form covers a harness module's
    # own child files (`kani_proofs/model.rs` beside `kani_proofs.rs`); none exist
    # yet, and `make check-kani-shards` requires every such directory to sit
    # beside the gated `kani_proofs.rs`. The measured effect of both globs (which
    # mutants they remove, and that no production file's count changes) is in
    # docs/mutation-testing.md, "Harness code is excluded, measured from the tool".
    "crates/**/kani_proofs.rs",
    "crates/**/kani_proofs/**",
    # The verification environment models the Kani harnesses and the shell
    # conformance tests share (`verify-shell-conformance-against-proven-cores`
    # D1): the write disk model and the draft journal model. They are
    # verification code, compiled only under `cfg(kani)`, `cfg(test)` and
    # `test-utils`; a mutant inside one weakens the oracle, not a shipped
    # behaviour, and proof strength measures the harnesses that use them.
    # Path-keyed: re-key these entries if the modules move.
    "crates/lushtext-services/src/filesystem/write_protocol/disk_model.rs",
    "crates/lushtext-services/src/persistence/draft_service/journal_model.rs",
]

exclude_re = [
    # Derived/debug-only formatting changes are equivalent for user behavior and
    # would otherwise create low-signal survivors in domain value objects.
    "impl Debug",
    # Equivalent: deleting the dedicated UTF-8 BOM arm in `encode_text` falls
    # through to the generic BOM-writing branch and produces identical bytes.
    "crates/lushtext-services/src/editor_io/mod\\.rs:.*delete match arm DocumentEncoding::Utf8Bom in encode_text",
    # Property-test-only bridge: the default mutation lane intentionally omits
    # `lushtext-ui/property-tests`; the property lane covers this helper.
    "crates/lushtext-services/src/lib\\.rs:.*property_testing::rebase_document_identity_paths",
    "crates/lushtext-services/src/search/content_search/replace/stream\\.rs:.*apply_replacements_to_text_for_property_test",
    "crates/lushtext-services/src/palette/commands\\.rs:.*merge_sorted_for_property_test",
    # Race-only branches: if metadata says a file exists but it disappears before
    # the read, recovery treats the state as missing. This is intentionally the
    # same user-visible fallback as startup without that metadata file.
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace match guard error\\.kind\\(\\) == io::ErrorKind::NotFound with (true|false) in load_existing_json_file",
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace == with != in load_existing_json_file",
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace match guard error\\.kind\\(\\) == io::ErrorKind::NotFound with (true|false) in load_existing_enveloped_json_file",
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace == with != in load_existing_enveloped_json_file",
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace match guard error\\.kind\\(\\) == io::ErrorKind::NotFound with (true|false) in load_existing_enveloped_json_file_for_replacement",
    "crates/lushtext-services/src/persistence/recovery_metadata\\.rs:.*replace == with != in load_existing_enveloped_json_file_for_replacement",
    # Equivalent: missing snapshot files are intentionally ignored during
    # retention cleanup; this mutation only changes whether that no-op logs.
    "crates/lushtext-services/src/persistence/local_history_service\\.rs:.*replace != with == in remove_snapshot_files",
    # Equivalent for stable directory entries: non-symlink classification is
    # identical whether it uses `DirEntry::file_type()` or follows with metadata.
    "crates/lushtext-services/src/workspace/file_tree\\.rs:.*replace match guard !file_type\\.is_symlink\\(\\) with false in classify_entry",
    # Equivalent under the workspace persistence state machine's own invariants,
    # confirmed by slot 5b's triage of the seven survivors this module inherited
    # when it relocated out of `model/workspace_persistence.rs`.
    #
    # `has_pending_work` is `requested != durable || in_flight.is_some() ||
    # failed.is_some()`. Replacing the *second* `||` yields `a || (b && c)`, which
    # differs from `a || b || c` only when `a` is false and exactly one of `b`/`c`
    # is true. Both such states are unreachable: `in_flight` and `failed` are
    # mutually exclusive (`apply_failure` clears the worker slot before recording
    # the failure, and `start`/`apply_success` clear the failure), and each of them
    # implies `requested != durable` — `start` requires it, and only `apply_success`
    # advances `durable`, which clears both. So the trailing disjuncts are
    # *defensive redundancy* rather than live logic, and no test can distinguish the
    # mutant.
    #
    # The invariant is pinned by
    # `an_in_flight_write_and_a_recorded_failure_are_mutually_exclusive_and_both_imply_dirt`,
    # which fails if a future change makes either state reachable — at which point
    # this exclusion must be removed rather than widened. Scoped to this one
    # operator in this one function: the first `||`, the `!=`, and the function's
    # return value all still mutate and are all killed.
    "crates/lushtext-ui/src/ui/sidebar/policy\\.rs:.*:68: replace \\|\\| with && in WorkspacePersistenceState::has_pending_work",
    # Never compiled by the mutation lane: `markdown_chunked_cap`'s
    # `cfg(not(feature = "test-utils"))` arm. Unlike the cfg-disabled stubs
    # around it, this is the arm that ships (a `const fn` returning `None`),
    # but the lane's one workspace test build always has `test-utils`, which
    # the `lushtext` crate's dev-dependency enables on `lushtext-ui`, so a
    # mutant here builds unchanged code and can only be missed (found in
    # `reduce-build-disk-writes`' focused rounds). Its `test-utils` twin above
    # it is in scope and killed by the integration test `document_scale`.
    # Line-anchored: re-key this entry if the function moves.
    "crates/lushtext-model/src/document/document_scale\\.rs:229:.*replace markdown_chunked_cap -> Option<u64> with Some\\([01]\\)",
    # Equivalent on LushText's Linux mutation target: this non-Unix metadata
    # shim is cfg-disabled, while the active Unix metadata probe remains in scope.
    "crates/lushtext-services/src/persistence/durable_write\\.rs:801:.*MetadataPlan::probe -> std::io::Result<Self>",
    "crates/lushtext-services/src/persistence/durable_write\\.rs:812:.*MetadataPlan::create_mode -> Option<u32> with Some\\(0\\)",
    "crates/lushtext-services/src/persistence/durable_write\\.rs:812:.*MetadataPlan::create_mode -> Option<u32> with Some\\(1\\)",
    # Equivalent on LushText's Linux mutation target: these non-Unix raw
    # filesystem fallbacks are cfg-disabled, while the active Unix backend
    # helpers remain mutation-scoped.
    # Line-anchored on the `cfg(not(unix))` (or non-Linux) twin of each helper;
    # re-keyed by `verify-shell-conformance-against-proven-cores`, whose tap
    # wraps every backend primitive. The non-Unix `sync_dir_descriptor` and
    # non-Linux `copy_xattrs_best_effort` generate no mutant any more, so their
    # entries were retired.
    "crates/lushtext-services/src/filesystem/sys\\.rs:87:.*kind_from_std_metadata -> FileKind",
    "crates/lushtext-services/src/filesystem/sys\\.rs:122:.*create_dir -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "crates/lushtext-services/src/filesystem/sys\\.rs:139:.*remove_file -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "crates/lushtext-services/src/filesystem/sys\\.rs:152:.*remove_dir -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "crates/lushtext-services/src/filesystem/sys\\.rs:168:.*rename -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "crates/lushtext-services/src/filesystem/sys\\.rs:505:.*visit_directory_entries",
    "crates/lushtext-services/src/filesystem/sys\\.rs:513:.*visit_directory_entries",
    "crates/lushtext-services/src/filesystem/sys\\.rs:596:.*mode",
    "crates/lushtext-services/src/filesystem/sys\\.rs:604:.*link_inode",
    "crates/lushtext-services/src/filesystem/sys\\.rs:609:.*inode",
    "crates/lushtext-services/src/filesystem/sys\\.rs:625:.*descriptor_file_len",
    "crates/lushtext-services/src/filesystem/sys\\.rs:671:.*create_temp_file",
    "crates/lushtext-services/src/filesystem/sys\\.rs:686:.*sync_file",
    "crates/lushtext-services/src/filesystem/sys\\.rs:843:.*symlink",
    "crates/lushtext-services/src/filesystem/sys\\.rs:862:.*set_permissions_mode",
    "crates/lushtext-services/src/filesystem/sys\\.rs:876:.*set_xattr",
    "crates/lushtext-services/src/filesystem/sys\\.rs:889:.*get_xattr",
    # Equivalent for Unix directory traversal flags: `RDONLY` is the empty
    # access-mode bitset and `DIRECTORY`/`CLOEXEC` are disjoint, so XOR produces
    # the same final flags here. The flag-contract test still catches removal.
    "crates/lushtext-services/src/filesystem/sys\\.rs:.*replace \\| with \\^ in directory_traversal_open_flags",
    # Equivalent for Unix temp-file flags: `WRONLY`, `CREATE`, `EXCL`, and
    # `CLOEXEC` occupy disjoint bits, so XOR produces the same open flags here.
    "crates/lushtext-services/src/filesystem/sys\\.rs:.*replace \\| with \\^ in create_temp_file",
    # Durability-only wrappers: deleting the fsync calls has no stable unit-test
    # effect without crash/power-loss simulation; callers remain covered through
    # their bytes, permissions, and namespace behavior.
    "crates/lushtext-services/src/filesystem/sys\\.rs:630:.*sync_dir_descriptor -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "crates/lushtext-services/src/filesystem/sys\\.rs:679:.*sync_file -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    # Ownership preservation is best-effort because ordinary users cannot
    # reliably create different-owner fixtures; mode, xattr, and ACL metadata
    # remain tested through observable durable-write behavior.
    "crates/lushtext-services/src/filesystem/sys\\.rs:710:.*best_effort_chown",
    # Durability-only wrapper: deleting the parent-directory fsync has no stable
    # observable unit-test effect, while callers are covered through their bytes
    # and namespace behavior.
    "crates/lushtext-services/src/filesystem/write\\.rs:.*sync_parent_dir",
    # Race-only diagnostic branch: if the recents file vanishes between status
    # and read, both paths return an empty recent list; only the warning changes.
    # Keyed on the `NotFound` guard (the function's only `==`), not a line: the
    # former `:252:` anchor had drifted off the function and matched nothing.
    "crates/lushtext-services/src/persistence/recent_documents\\.rs:.*: replace (match guard error\\.kind\\(\\) == std::io::ErrorKind::NotFound with (true|false)|== with !=) in load_recent_file",
    # Equivalent while the public JSON envelope is still v1.
    "crates/lushtext-services/src/persistence/format_upgrade/diagnostics\\.rs:.*latest_format_version -> u32 with 1",
    # Equivalent after the preceding exact-version branch in
    # `classify_json_bytes`: latest-version envelopes return before the
    # future-version comparison, so `>` and `>=` see the same remaining inputs.
    "crates/lushtext-services/src/persistence/format_upgrade/inventory\\.rs:.*replace > with >= in classify_json_bytes",
    # Equivalent on the Unix paths used by this target: `Path::parent()` does
    # not yield the same root path, so the loop guard behaves identically.
    "crates/lushtext-services/src/workspace/editorconfig\\.rs:.*replace match guard parent != dir with true in resolve_for_path",
    # Equivalent: references emitted by pulldown-cmark also have definitions,
    # so label reservation is already covered by `FootnoteDefinition`, while
    # protected references fall through to the protected-depth catch-all arm.
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*delete match arm MarkdownEvent::FootnoteReference\\(label\\) in build_scan_plan(_cancellable)?",
    # Equivalent: the scan loop may do one extra final-byte check, but a lone
    # trailing byte cannot start a complete `^[...]` marker.
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*replace < with <= in collect_inline_footnote_replacements(_bounded)?",
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*replace \\+ with \\* in collect_inline_footnote_replacements(_bounded)?",
    # Equivalent: after a replacement is recorded, restarting at or just before
    # the closing bracket only rechecks bytes that cannot form a new marker.
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*replace \\+ with - in collect_inline_footnote_replacements(_bounded)?",
    # Equivalent: protected ranges ending at the current index have already been
    # advanced out of consideration by the preceding `end <= index` loop.
    # NOT an equivalence claim -- an unkillable-by-construction claim, which is a
    # different thing and is stated as one. These four items are the Markdown
    # preview workflow's fuzz and property-test entry points, and every one of them
    # is behind `#[cfg(any(feature = "property-tests", feature = "fuzzing"))]`. The
    # default mutation lane deliberately runs with neither feature (property cases
    # belong to `make test-prop`, so that mutants are not multiplied by generated
    # cases), so this code is not compiled and no mutation of it can change any
    # test result. Listing them without excluding them would report 11 permanent
    # survivors that no test could ever kill.
    #
    # They entered scope because a facade migration moved them into the workflow's
    # `policy.rs`; before that they sat in a module the convention did not reach.
    # The same move brought in one mutant that is NOT excluded here --
    # `inline_footnote_limited_plan` is real production policy with three
    # production callers, it was mis-filed under the fuzz banner, and its survivor
    # was a genuine gap now killed by
    # `the_inline_footnote_limited_plan_reports_the_source_size_it_refused`.
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*lower_inline_footnotes_for_generated_test",
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*lower_inline_footnotes_for_property_test",
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*lowered_markdown_for_fuzzing",
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*preprocess_markdown_for_fuzzing",
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*replace < with <= in find_inline_footnote_close(_cancellable)?",
    # Equivalent: the byte scanner only branches on ASCII marker bytes and only
    # slices at ASCII delimiter offsets, so byte-by-byte UTF-8 walking is valid.
    "crates/lushtext-services/src/notes/markdown_render/inline_footnotes\\.rs:.*replace next_char_len -> usize with 1",
    # Test-only global injector: path-scoped cleanup-failure injection is covered
    # by local-history retry tests; the all-path hook is retained for manual tests.
    "crates/lushtext-services/src/persistence/local_history_service\\.rs:.*fail_next_obsolete_lineage_cleanup_for_test",
    # Diagnostics-only logging helper: callers keep and surface recovery
    # diagnostics through returned values; this mutation only suppresses tracing.
    "crates/lushtext-services/src/notes/note_storage\\.rs:.*trace_recovery_diagnostics",
    # Feature-only hooks: widget race tests and fuzz targets own these paths in
    # their dedicated lanes, outside the default deterministic mutation scope.
    "crates/lushtext-services/src/editor_io/mod\\.rs:.*(set_load_delay_for_test|delay_load_for_test|classify_bytes_for_fuzzing)",
    # The `test-utils` benchmark hooks of `simd-line-scans` (`bench_*`): the
    # default-feature build cargo-mutants tests never compiles them.
    "crates/lushtext-services/src/editor_io/mod\\.rs:.*bench_(load_analysis|load_analysis_fused|health_scan|trim|normalize|crlf_check)",
    # `MinimapAnalysisAccumulator::inspect_str` (simd-line-scans). Only the
    # first entry is line-anchored (re-key it on any edit above line 2804): it is
    # the per-character copy compiled only under `cfg(kani)`, which no test build
    # compiles, and shares its name with the tested copy. The rest are
    # equivalent and unique in their functions: `<` with `<=` in the paragraph
    # loop bound runs one more pass over an empty tail, which `extend_line`
    # ignores; in `paragraph_may_cross` and `thresholds_in_play`, `>` with `>=`
    # and `&&` with `||` only count more lines exactly, never fewer, and an
    # exact count yields the same state.
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:2804:9: replace MinimapAnalysisAccumulator::inspect_str with \\(\\)",
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:.*replace < with <= in MinimapAnalysisAccumulator::inspect_str",
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:.*replace > with >= in paragraph_may_cross",
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:.*replace && with \\|\\| in MinimapAnalysisAccumulator::thresholds_in_play",
    # Equivalent in `fit_native_slider_to_source_map_bounds`: equality at the
    # lower or upper edge only applies a zero-sized adjustment and preserves the
    # same final fitted bounds; strict outside-edge behavior remains covered.
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:.*replace < with <= in fit_native_slider_to_source_map_bounds",
    "crates/lushtext-ui/src/ui/editor_page/minimap/policy\\.rs:.*replace > with >= in fit_native_slider_to_source_map_bounds",
    # Equivalent in `expanded_to_min_height`, the shared min-height expansion:
    # at `top == lower` the block adds a zero offset and re-assigns `lower`, and
    # at `bottom == upper` it subtracts a zero offset and re-assigns `upper`, so
    # both mutants produce byte-identical bounds. Each entry matches exactly one
    # mutant, which is why the block was extracted: the same claim scoped to
    # either caller would have swallowed caught mutants from their unrelated
    # reject/accept guards, and that is a weakening rather than a re-key.
    #
    # The four `fit_marker_bounds` entries that used to sit here were **deleted**
    # rather than moved. Their recorded reason was "the same final clamped bounds
    # after the minimum-height expansion settles" — and that expansion has left
