schema_version = 1
excluded_prefixes = ["openspec-", "speckit-"]

[implicit_invocation]
learn = true
gtk-perf-review = true
lushtext-workflow = true
gtk-perf-rust-optimize = false
gtk-perf-scale = false
gtk-responsiveness = false

[performance]
umbrella = "gtk-perf-review"
leaves = [
  "gtk-perf-rust-optimize",
  "gtk-perf-scale",
  "gtk-responsiveness",
]
package_metadata_namespace = "lushtext-agent"
package_metadata_key = "performance-roots"
fallback_suffixes = ["src/ui", "src/services", "src/model", "benches"]

# The machine form of the data-safety skill's trigger description, read by
# `scripts/agent-topology.py review-lenses` to decide the review fan-out
# (.agents/rules/parallel-agent-work.md, "Stages after implementation").
# `scripts/validate-agent-skills.py` fails when a suffix's last component (as
# `<name>/`) or a keyword is missing from that description.
[data_safety]
skill = "data-safety"
path_suffixes = ["src/ui", "src/services", "src/model", "lushtext-model/src", "lushtext-services/src"]
content_patterns = [
  { keyword = "file I/O", pattern = "services::filesystem|std::[f]s\\b|\\bFileMonitor\\b|\\bgio::File\\b" },
  { keyword = "buffer state", pattern = "\\bTextBuffer\\b|\\bset_modified\\b|\\bis_modified\\b|\\bbuffer\\(\\)" },
  { keyword = "tab or window close", pattern = "close_request|close_page|close-tab|\\bclose_tab\\b" },
  { keyword = "persistence", pattern = "json_store|durable_write|draft_service|session_service|\\bpersist" },
  { keyword = "spawn_blocking_then", pattern = "spawn_blocking_then" },
  { keyword = "search/replace", pattern = "replace_all|content_search|\\bReplace\\b" },
]

[filesystem_contract]
paths = [
  "AGENTS.md",
  ".agents/rules/rust.md",
  ".agents/rules/build.md",
  ".agents/skills/data-safety/SKILL.md",
  ".agents/skills/gtk-perf-review/SKILL.md",
  ".agents/skills/gtk-perf-rust-optimize/SKILL.md",
  ".agents/skills/gtk-perf-scale/SKILL.md",
  ".agents/skills/gtk-responsiveness/SKILL.md",
  ".agents/skills/rust-comments/SKILL.md",
  ".agents/skills/rust-hex-arch/SKILL.md",
]

[release]
workflow_role_marker = "agent-release-role"
required_workflow_roles = ["publication", "benchmark-report"]
