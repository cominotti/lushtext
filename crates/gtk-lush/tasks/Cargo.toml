[package]
name = "gtk-lush-tasks"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded background task dispatch helpers for gtk-rs applications"
readme = "README.md"
repository = "https://github.com/cominotti/lushtext"
keywords = ["gtk", "gtk4", "tasks", "rust"]
categories = ["gui", "development-tools"]
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "examples/**",
    "src/**",
]

[package.metadata.lushtext-agent]
performance-roots = ["src"]

[lints]
workspace = true

[features]
# Measurement builds only: `set_completion_observer` reports every
# completion's span (LushText's `responsiveness-probes` build enables it).
completion-observer = []

[dependencies]
glib = { workspace = true }

[dev-dependencies]
gtk4 = { workspace = true }
