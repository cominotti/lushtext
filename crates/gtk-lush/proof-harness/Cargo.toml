[package]
name = "gtk-lush-proof-harness"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Headless GTK proof harness helpers for gtk-rs applications"
readme = "README.md"
repository = "https://github.com/cominotti/lushtext"
keywords = ["gtk", "gtk4", "testing", "headless"]
categories = ["gui", "development-tools", "development-tools::testing"]
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "examples/**",
    "src/**",
]

[lints]
workspace = true

[dependencies]
glib = { workspace = true }
gtk4 = { workspace = true }
tempfile = { workspace = true }
