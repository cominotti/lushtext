#
# gtk-lush-proof-harness session helper: WirePlumber without module-rt.
#
# Verified against WirePlumber 0.5.19, /usr/share/wireplumber/wireplumber.conf
# (2026-11-14). WirePlumber loads libpipewire-module-rt unconditionally twice,
# in `context.modules` and in the `client-context` component's
# `arguments.context.modules`, and supports no `condition`; a
# `module.rt.args` fragment was measured to have no effect (the module fell
# back to RTKit and set nice -11). So this fragment uses the two supported
# override hooks and repeats the distribution's module lists minus module-rt.
# On a WirePlumber update, re-read both lists in wireplumber.conf
# (.agents/rules/build.md, "GTK Axioms and Toolkit Updates"); a module added
# there and missing here surfaces as a broken capture, and the runtime guard
# checks that module-rt stays absent. `make check-session-hygiene` fails if
# module-rt reappears here or either hook goes away.
context.properties = {
    module.rt = false
}

override.context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
]

wireplumber.components.rules = [
    {
        matches = [ { name = "client-context" } ]
        actions = {
            override = {
                arguments = {
                    context.modules = [
                        { name = libpipewire-module-protocol-native }
                        { name = libpipewire-module-client-node }
                        { name = libpipewire-module-client-device }
                        { name = libpipewire-module-adapter }
                        { name = libpipewire-module-spa-node-factory }
                        { name = libpipewire-module-metadata }
                    ]
                }
            }
        }
    }
]
