#
# gtk-lush-proof-harness session helper: PipeWire without module-rt.
#
# Installed as the daemon's pipewire.conf.d fragment and as the client.conf.d
# fragment every PipeWire client of the session reads (mutter's ScreenCast
# stream, gst `pipewiresrc`). The distribution's pipewire.conf and client.conf
# guard libpipewire-module-rt with `condition = [ { module.rt = !false } ]`
# (verified against PipeWire 1.6.11), so this property keeps the module from
# loading and asking the host's RealtimeKit for priorities: a capture without
# the client fragment added 18 RealtimeKit1 messages per case.
# `make check-session-hygiene` fails if this setting drifts.
context.properties = {
    module.rt = false
}
