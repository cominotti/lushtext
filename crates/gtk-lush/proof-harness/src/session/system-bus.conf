<!-- gtk-lush-proof-harness session helper: the private system bus.

     Exported as DBUS_SYSTEM_BUS_ADDRESS to every process of a test session.
     It has no service directory, so every system service (RealtimeKit,
     bluetoothd, locale1, colord, login1, UPower) answers ServiceUnknown and
     nothing reaches the host, and it lets the helper's dbus-monitor record
     every message for the runtime guard. @LISTEN@ is replaced at start. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>gtk-lush-private-system</type>
  <listen>@LISTEN@</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
  </policy>
</busconfig>
