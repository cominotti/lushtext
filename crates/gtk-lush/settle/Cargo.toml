[package]
name = "gtk-lush-settle"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Generation-counter debounce and settle helpers for gtk-rs"
readme = "README.md"
repository = "https://github.com/cominotti/lushtext"
keywords = ["gtk", "gtk4", "debounce", "rust"]
categories = ["gui", "development-tools"]
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "examples/**",
    "src/**",
]

[lints]
workspace = true

[dependencies]
glib = { workspace = true }

[dev-dependencies]
gtk4 = { workspace = true }
proptest = { workspace = true }
