[package]
name = "gtk-lush-proof-spine"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded readiness, snapshot, and artifact protocol primitives"
readme = "README.md"
repository = "https://github.com/cominotti/lushtext"
keywords = ["gtk", "testing", "automation", "schema"]
categories = ["gui", "development-tools", "development-tools::testing"]
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "examples/**",
    "src/**",
]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
