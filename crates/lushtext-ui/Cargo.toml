[package]
name = "lushtext-ui"
version = "0.8.3"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[package.metadata.lushtext-agent]
performance-roots = ["src/ui", "benches"]
release-ui-roots = ["src/ui"]

[features]
# Deterministic crash injection for the crash-recovery smoke build only; see
# `services::kill_point`. Never enabled in release, Meson, Flatpak, or Snap.
crash-kill-points = ["lushtext-services/crash-kill-points"]
# Deterministic document-read denial for the accessibility and visual smoke
# builds only; see `services::read_fault`. Never enabled in release, Meson,
# Flatpak, or Snap.
smoke-read-faults = ["lushtext-services/smoke-read-faults"]
# Smoke-only overrides of the workspace list budgets (`services::smoke_list_budgets`):
# never in release, Meson, Flatpak or Snap builds.
smoke-list-budgets = ["lushtext-services/smoke-list-budgets"]
# In-process responsiveness probes (main-loop lateness watchdog, frame and
# input timing, probe input method) for the `make responsiveness-smoke`
# measurement build only; see `ui::responsiveness_probe`. Never enabled in
# release, Meson, Flatpak, or Snap.
responsiveness-probes = ["gtk-lush-tasks/completion-observer", "lushtext-services/responsiveness-probes"]
# A timed hold of window composition after the first frame
# (`LUSHTEXT_COMPOSITION_HOLD_MS`), for the visual-geometry lane's
# `first-frame-shell` scenario only; see `ui::window::composition`. Built into
# `target/composition-hold/` only. Never enabled in release, Meson, Flatpak,
# or Snap.
composition-hold = []
fuzzing = ["lushtext-services/fuzzing"]
# The property suite seeds unregistered fixture bodies, which only exist
# with `test-utils`.
property-tests = ["test-utils", "lushtext-services/property-tests"]
test-utils = ["lushtext-model/test-utils", "lushtext-services/test-utils"]

[dependencies]
lushtext-model    = { workspace = true }
lushtext-services = { workspace = true }
gtk-lush-settle = { workspace = true }
gtk-lush-signals = { workspace = true }
gtk-lush-tasks = { workspace = true }
gtk-lush-viewport = { workspace = true }
gtk-lush-widgets = { workspace = true }
gtk4        = { workspace = true }
libadwaita  = { workspace = true }
sourceview5 = { workspace = true }
gio         = { workspace = true }
glib        = { workspace = true }
gdk4        = { workspace = true }
pango       = { workspace = true }
crossbeam-channel = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing        = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true

[build-dependencies]
glib-build-tools = "0.22"
lushtext-build-support = { workspace = true }

[dev-dependencies]
lushtext-model    = { workspace = true, features = ["test-utils"] }
lushtext-services = { workspace = true, features = ["test-utils"] }
notify-debouncer-full = { workspace = true }
tempfile          = { workspace = true }
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name = "benchmarks"
harness = false

[[test]]
name = "properties"
path = "tests/properties.rs"
required-features = ["property-tests"]

[[test]]
name = "fuzz_corpus_replay"
path = "tests/fuzz_corpus_replay.rs"
required-features = ["fuzzing"]
