[package]
name = "lushtext"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "A minimalist text editor for GNOME"
publish = false
build = "build.rs"

[[bin]]
name = "lushtext"
path = "src/main.rs"

[[test]]
name = "widget"
path = "tests/widget.rs"
harness = false

[lints]
workspace = true

[build-dependencies]
lushtext-build-support = { workspace = true }

[dependencies]
lushtext-core      = { workspace = true }
glib               = { workspace = true }
tracing-subscriber = { workspace = true }
workspace-hack     = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
lushtext-core = { workspace = true, features = ["test-utils"] }
tempfile    = { workspace = true }
assert_cmd  = { workspace = true }
predicates  = { workspace = true }
serde_json  = { workspace = true }
gtk4        = { workspace = true }
gtk-lush-proof-harness = { workspace = true }
libadwaita  = { workspace = true }
sourceview5 = { workspace = true }
gio         = { workspace = true }
libtest-mimic = { workspace = true }
