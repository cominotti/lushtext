[package]
name = "lushtext-core"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[features]
fuzzing = []
property-tests = []
test-utils = []

[dependencies]
gtk-lush-settle = { workspace = true }
gtk-lush-signals = { workspace = true }
gtk-lush-tasks = { workspace = true }
gtk-lush-viewport = { workspace = true }
gtk-lush-widgets = { workspace = true }
gtk4        = { workspace = true }
libadwaita  = { workspace = true }
sourceview5 = { workspace = true }
gio         = { workspace = true }
glib        = { workspace = true }
gdk4        = { workspace = true }
pango       = { workspace = true }
grep-regex    = { workspace = true }
grep-searcher = { workspace = true }
grep-matcher  = { workspace = true }
ignore        = { workspace = true }
crossbeam-channel = { workspace = true }
regex       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
dirs        = { workspace = true }
notify-debouncer-full = { workspace = true }
rustix      = { workspace = true }
tracing        = { workspace = true }
nucleo-matcher = { workspace = true }
simdutf8       = { workspace = true }
encoding_rs    = { workspace = true }
unicase            = { workspace = true }
editorconfig-parser = { workspace = true }
pulldown-cmark      = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true

[build-dependencies]
glib-build-tools = "0.22"
lushtext-build-support = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
criterion = { workspace = true }
proptest  = { workspace = true }

[[bench]]
name = "benchmarks"
harness = false

[[test]]
name = "properties"
path = "tests/properties.rs"
required-features = ["property-tests"]

[[test]]
name = "fuzz_corpus_replay"
path = "tests/fuzz_corpus_replay.rs"
required-features = ["fuzzing"]
