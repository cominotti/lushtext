[workspace]
resolver = "2"
members = [
    "crates/lushtext-core",
    "crates/lushtext",
    "workspace-hack",
]
exclude = ["fuzz"]

# Default binary for `cargo run`
default-members = ["crates/lushtext"]

[workspace.package]
rust-version = "1.95.0"

# --- Centralized dependencies (union of features across all crates) ---

[workspace.dependencies]
# Internal crates
lushtext-core = { path = "crates/lushtext-core" }

# GTK / GNOME stack
gtk4        = { version = "0.11", features = ["gnome_50"] }
libadwaita  = { version = "0.9",  features = ["v1_9", "gtk_v4_22"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
gio         = { version = "0.22", features = ["v2_88"] }
glib        = { version = "0.22", features = ["v2_88"] }
gdk4        = { version = "0.11", features = ["v4_22"] }
pango       = { version = "0.22", features = ["v1_57"] }

# Content search (ripgrep engine)
grep-regex    = "0.1"
grep-searcher = "0.1"
grep-matcher  = "0.1"
ignore        = "0.4"
crossbeam-channel = "0.5"

# Serialization (workspace config, session persistence)
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow    = "1.0"
thiserror = "2.0"

# Filesystem
dirs = "6.0"
libc = "0.2"
notify-debouncer-full = "0.7"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fuzzy matching (SIMD-accelerated)
nucleo-matcher = "0.3"

# SIMD-accelerated UTF-8 validation for large files
simdutf8 = "0.1"

# WHATWG-compliant text encoding and transcoding for non-UTF-8 files
encoding_rs = "0.8"

# Zero-allocation case-insensitive string comparison
unicase = "2"

# EditorConfig parsing (pure Rust, zero deps)
editorconfig-parser = "0.0.4"

# Regex (backreference expansion in Replace All)
regex = "1"

# Markdown parsing (CommonMark, streaming events)
pulldown-cmark = { version = "0.13", default-features = false }

# Dev / test
tempfile   = "3.14"
assert_cmd = "2.0"
predicates = "3.0"
criterion  = { version = "0.8", features = ["html_reports"] }
libtest-mimic = "0.8"
proptest = "1.11.0"

# --- Workspace-wide lint configuration ---
# Crates opt in with `[lints] workspace = true`.

[workspace.lints.clippy]
# --- API design ---
must_use_candidate            = "deny"
return_self_not_must_use      = "deny"
needless_pass_by_value        = "deny"
trivially_copy_pass_by_ref    = "deny"
large_types_passed_by_value   = "deny"
unused_self                   = "deny"
allow_attributes              = "deny"
allow_attributes_without_reason = "deny"

# --- Edition 2024 idioms ---
uninlined_format_args         = "deny"
cloned_instead_of_copied      = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else               = "deny"
manual_string_new             = "deny"
manual_is_variant_and         = "deny"
manual_assert                 = "deny"

# --- Idiomatic Rust ---
redundant_closure_for_method_calls = "deny"
implicit_clone                     = "deny"
map_unwrap_or                      = "deny"
single_match_else                  = "deny"
match_same_arms                    = "deny"
match_wildcard_for_single_variants = "deny"
match_bool                         = "deny"
flat_map_option                    = "deny"
needless_for_each                  = "deny"
range_plus_one                     = "deny"
default_trait_access               = "deny"
from_iter_instead_of_collect       = "deny"
iter_not_returning_iterator        = "deny"
expl_impl_clone_on_copy            = "deny"
explicit_iter_loop                 = "deny"
explicit_into_iter_loop            = "deny"
explicit_deref_methods             = "deny"
if_not_else                        = "deny"
bool_to_int_with_if                = "deny"
inconsistent_struct_constructor    = "deny"
unnested_or_patterns               = "deny"
string_add_assign                  = "deny"
or_fun_call                        = "deny"

# --- Numeric safety ---
cast_lossless                 = "deny"
cast_possible_truncation      = "deny"
cast_sign_loss                = "deny"
checked_conversions           = "deny"
unwrap_used                   = "deny"

# --- Performance ---
inefficient_to_string         = "deny"
large_stack_arrays            = "deny"
unnecessary_box_returns       = "deny"
stable_sort_primitive         = "deny"
iter_with_drain               = "deny"

# --- Clarity ---
unreadable_literal            = "deny"
separated_literal_suffix      = "deny"

# --- Safety docs ---
missing_safety_doc            = "deny"
ptr_as_ptr                    = "deny"
undocumented_unsafe_blocks    = "deny"
missing_errors_doc            = "deny"
missing_panics_doc            = "deny"
dbg_macro                     = "deny"
todo                          = "deny"
unimplemented                 = "deny"

[workspace.lints.rust]
# Edition 2024 defaults we want to keep enforced
unsafe_op_in_unsafe_fn  = "deny"
tail_expr_drop_order    = "deny"

# --- Compilation speed profiles ---

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
